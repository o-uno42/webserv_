<!DOCTYPE html>
<html>
<head>
    <title>Your swamp!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            background-image: url('pics/shrek.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0 auto;
            padding: 20px;
            transition: background-image 0.5s ease;
        }
        body.dark-mode {
            background-image: url('pics/shrek-night.jpg');
            color: #f0f0f0;
        }
        form {
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        body.dark-mode form {
            background-color: rgba(40, 40, 40, 0.8);
            border-color: #444;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        
        /* Theme toggle switch styles */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 20px;
        }
        body.dark-mode .theme-switch-wrapper {
            background-color: rgba(40, 40, 40, 0.7);
        }
        .theme-switch {
            display: inline-block;
            height: 34px;
            position: relative;
            width: 60px;
        }
        .theme-switch input {
            display: none;
        }
        .slider {
            background-color: #ccc;
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            background-color: #fff;
            bottom: 4px;
            content: "";
            height: 26px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 26px;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .theme-switch-wrapper em {
            margin-left: 10px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <!-- Theme toggle switch -->
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
        </label>
        <em>Toggle Dark Mode</em>
    </div>

    <h1>Your Swamp!</h1>
    
    <h2>Register</h2>
    <form action="/database/data.txt" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email">
        
        <button type="submit">Register (POST)</button>
    </form>
    <form action="/database/files" method="POST" enctype="multipart/form-data">
        <input type="file" name="myfile">
        <button type="submit">Upload file (POST)</button>
    </form>
    <h2>Delete a file</h2>
    <form id="deleteMethod"> 
        <!-- since Delete is not supported by HTML directly -->
        <input type="text" name="fileToRemove" placeholder="File to remove">
        <button type="submit">Delete file (DELETE)</button>
    </form>
    <h2>Login</h2>
    <form action="/database/data.txt" method="GET">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email">
        
        <button type="submit">Login (GET)</button>
    </form>

    <script>
        // Theme toggle functionality
        const toggleSwitch = document.querySelector('#checkbox');
        const body = document.body;

        // Function to parse cookies from document.cookie
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Apply theme based on cookie
        function applyTheme() {
            const darkMode = getCookie('darkMode');
            if (darkMode === 'true') {
                body.classList.add('dark-mode');
                toggleSwitch.checked = true;
            } else {
                body.classList.remove('dark-mode');
                toggleSwitch.checked = false;
            }
        }

        // Apply theme on page load
        applyTheme();

        // Listen for toggle switch changes
        toggleSwitch.addEventListener('change', function() {
            const isDarkMode = this.checked;
            
            // Send request to server to set the cookie
            fetch('/set-theme', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `darkMode=${isDarkMode}`
            })
            .then(response => {
                if (response.ok) {
                    // Reload the page to get the new cookie from the server
                    window.location.reload();
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Keep the existing delete method functionality
        document.getElementById("deleteMethod").addEventListener("submit", function(event){
            console.log("Switching to Delete method");
            event.preventDefault(); //this stops html from making automatically a GET request
            let fileToRemove = document.querySelector("input[name=fileToRemove]").value;
        
            fetch("/database/files", {
                method: "DELETE",
                body: `fileToRemove=${encodeURIComponent(fileToRemove)}`
            })
            .then(response => response.text())
            .then(data => {document.body.innerHTML = data;}) //lo setta come HTML
            .catch(error => console.error("Error: ", error));
        });
    </script>
</body>
</html>
