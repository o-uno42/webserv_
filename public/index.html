<!DOCTYPE html>
<html>
    <head>
        <title>HI!</title>
    </head>
    <body>
        <h1>Hello Client!</h1>
        <h2>Your data was received</h2>
        <!-- <button onclick="sendRequest('GET')">GET</button>
        <button onclick="sendRequest('POST')">POST</button> -->
        <!-- <button onclick="sendRequest('DELETE')">DELETE</button> -->
        <form action="/cgi-bin" method="GET">
            <button type="submit">CGI GET</button>
        </form>
        <form action="/cgi-bin" method="POST">
            <button type="submit">CGI POST</button>
        </form>
        <h3>Sign in</h3>
        <form action="/upload" method="POST">
            <input type="text" name="Name" required>
            <br>
            <input type="password" name="Password" required>
            <br>
            <button type="submit">Sign In</button>
        </form>
        <h3>Upload a file</h3>
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Upload</button>
        </form>
    </body>
</html>
